<style>
    * {
        font-family: Arial, Helvetica, sans-serif;
    }

    #weekly-cal {
        display: flex;
    }

    h3 {
        padding: 10px 50px;
    }
    li {
        padding: 10px;
        margin: 5px 0;
        border-radius: 10px;
        background-color: lightgreen;
        cursor: pointer;
        list-style: none;
        width: 100px;
    }

    .schedule div {
        display: flex;
    }

    .schedule div li:not(:last-of-type) {
        margin: auto 5px auto 0;
    }

    li.unavailable {
        background-color: lightcoral;
    }
</style>

<body>
    <button id="prevWeek">Previous Week</button>
    <button id="nextWeek">Next Week</button>
    <section id="weekly-cal"></section>
</body>



<script>
    const container = document.getElementById('weekly-cal');

    function getWeek(current_week) {
        const grouped = {};
        container.innerHTML = '';
        fetch(`/data?week=${current_week}`).then(res => res.json()).then(data => {
            console.log(data)

            data = Object.entries(data).map(([key, value]) => {
                return { slot_id: Number(key), ...value };
            });


            data.forEach(item => {
                const obj = new Date(item.date);
                const obj2 = new Date(item.time);
                const date = obj.toDateString();
                const time = obj2.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});

                console.log(time)

                if (!grouped[date]) {
                    grouped[date] = [];
                }
                grouped[date].push({time: time, slot_id: item.slot_id, available: item.available});
            });
        }).then(() => {
            for (const [date, times] of Object.entries(grouped)) {
                const section = document.createElement('div');

                const title = document.createElement('h3')
                title.textContent = date;
                section.appendChild(title);

                const ul = document.createElement('ul');
                ul.classList.add('schedule')
                times.forEach(slot => {
                    const li = document.createElement('li');
                    li.textContent = slot.time;
                    li.classList.add('slot');
                    li.id = `slot-${slot.slot_id}`;
                    if(!slot.available) li.classList.add('unavailable')
                    ul.appendChild(li);
                });

                section.appendChild(ul);
                container.appendChild(section);
            }
        }).then(() => {
            const lists = document.querySelectorAll('.schedule');

            lists.forEach(list => {
                list.addEventListener('click', function (e) {
                    if (e.target && e.target.nodeName === 'LI') {
                        const classes = e.target.classList;
                        console.log(classes);
                        if (classes.contains('unavailable')){
                            const data = { id: e.target.id, status: 'True' };
                            fetch("/data/time-slot", {
                                method: "POST",               // specify POST
                                headers: {
                                    "Content-Type": "application/json", // sending JSON
                                },
                                body: JSON.stringify(data),   // convert JS object to JSON string
                            });
                        } else {
                            const data = { id: e.target.id, status: 'False' };
                            fetch("/data/time-slot", {
                                method: "POST",               // specify POST
                                headers: {
                                    "Content-Type": "application/json", // sending JSON
                                },
                                body: JSON.stringify(data),   // convert JS object to JSON string
                            });
                        }
                        e.target.classList.toggle('unavailable');
                    }
                });
            });
        });
    }


    let currentWeek = 0;

    getWeek(currentWeek);

    // Button handlers
    document.getElementById('prevWeek').addEventListener('click', () => {
        currentWeek--;
        getWeek(currentWeek);
    });

    document.getElementById('nextWeek').addEventListener('click', () => {
        currentWeek++;
        getWeek(currentWeek);
    });
</script>
